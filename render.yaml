services:
  - type: web
    name: school-learner-xapi-demo
    runtime: python
    buildCommand: pip install -r requirements.txt && python data_preprocessing.py && python train_models.py
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DEMO_MODE
        value: 'true'
      - key: APP_SECRET_KEY
        generateValue: true
